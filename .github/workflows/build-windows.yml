name: Build Windows app

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download repo
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r planner_app/requirements.txt
          pip install pyinstaller

      - name: Build app with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed `
            --name "Teacher Planner" `
            --icon "planner_app/assets/favicon.ico" `
            --add-data "planner_app/assets;planner_app/assets" `
            --add-data "planner_app/fonts;planner_app/fonts" `
            --add-data "planner_app/schools.json;planner_app" `
            planner_app/main.py

      - name: Zip the app
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Teacher Planner" -DestinationPath "dist/TeacherPlanner-windows.zip" -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TeacherPlanner-windows
          path: dist/TeacherPlanner-windows.zip
