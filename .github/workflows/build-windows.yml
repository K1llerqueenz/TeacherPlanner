name: Build Windows app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish the .exe under (leave blank to only build)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download repo
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r planner_app/requirements.txt
          pip install pyinstaller

      - name: Build single-file .exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --onefile `
            --name "TeacherPlanner" `
            --icon "planner_app/assets/favicon.ico" `
            --add-data "planner_app/assets;planner_app/assets" `
            --add-data "planner_app/fonts;planner_app/fonts" `
            --add-data "planner_app/schools.json;planner_app" `
            --collect-data customtkinter `
            --collect-data CTkMessagebox `
            --hidden-import babel.numbers `
            planner_app/main.py

      - name: Build folder version and zip it
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed `
            --name "Teacher Planner" `
            --icon "planner_app/assets/favicon.ico" `
            --add-data "planner_app/assets;planner_app/assets" `
            --add-data "planner_app/fonts;planner_app/fonts" `
            --add-data "planner_app/schools.json;planner_app" `
            --collect-data customtkinter `
            --collect-data CTkMessagebox `
            --hidden-import babel.numbers `
            planner_app/main.py
          Compress-Archive -Path "dist/Teacher Planner" -DestinationPath "dist/TeacherPlanner-windows.zip" -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TeacherPlanner-windows
          path: |
            dist/TeacherPlanner.exe
            dist/TeacherPlanner-windows.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Teacher Planner ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            Windows build of Teacher Planner, built from commit ${{ github.sha }}.

            Download **TeacherPlanner.exe** and double-click it to run. Windows SmartScreen may warn that the app is unrecognised because it isn't code-signed; click "More info" then "Run anyway".

            **TeacherPlanner-windows.zip** is the same app as a folder, which starts faster. Unzip it and run `Teacher Planner.exe` inside.
          files: |
            dist/TeacherPlanner.exe
            dist/TeacherPlanner-windows.zip
